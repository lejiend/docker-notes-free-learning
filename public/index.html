<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workshop Notes</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f3f6fa;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 32px 16px;
      }

      main {
        width: min(100%, 640px);
        margin: 0 auto;
      }

      h1 { margin: 0 0 8px; }
      .intro { margin: 0 0 24px; color: #5b6573; }

      form, .note {
        padding: 20px;
        border: 1px solid #dce3ec;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 3px 12px rgb(31 41 55 / 5%);
      }

      label { display: block; margin-bottom: 8px; font-weight: 600; }

      textarea {
        display: block;
        width: 100%;
        min-height: 110px;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font: inherit;
        resize: vertical;
      }

      button {
        margin-top: 12px;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled { opacity: 0.65; cursor: wait; }
      #status { min-height: 1.5em; color: #b42318; }
      h2 { margin: 28px 0 12px; }
      #notes { display: grid; gap: 12px; }
      .note { white-space: pre-wrap; overflow-wrap: anywhere; }
      .note time { display: block; margin-top: 10px; color: #64748b; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Workshop Notes v1.1</h1>
      <p class="intro">Add a note and it will be saved in MySQL.</p>

      <form id="note-form">
        <label for="content">Your note</label>
        <textarea id="content" name="content" required maxlength="5000" placeholder="Write something to remember..."></textarea>
        <button id="submit" type="submit">Save note</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>

      <h2>Saved notes</h2>
      <section id="notes" aria-live="polite" aria-label="Saved notes"></section>
    </main>

    <script>
      const form = document.querySelector("#note-form");
      const contentInput = document.querySelector("#content");
      const notesList = document.querySelector("#notes");
      const status = document.querySelector("#status");
      const submitButton = document.querySelector("#submit");

      async function loadNotes() {
        const response = await fetch("/api/notes");
        if (!response.ok) throw new Error("Could not load notes.");
        const notes = await response.json();

        notesList.replaceChildren();
        for (const note of notes) {
          const article = document.createElement("article");
          article.className = "note";
          article.append(document.createTextNode(note.content));

          const date = document.createElement("time");
          date.dateTime = note.created_at;
          date.textContent = new Date(note.created_at).toLocaleString();
          article.append(date);
          notesList.append(article);
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.textContent = "";
        submitButton.disabled = true;

        try {
          const response = await fetch("/api/notes", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content: contentInput.value })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not save note.");

          contentInput.value = "";
          await loadNotes();
        } catch (error) {
          status.textContent = error.message;
        } finally {
          submitButton.disabled = false;
        }
      });

      loadNotes().catch((error) => {
        status.textContent = error.message;
      });
    </script>
  </body>
</html>
