services:
  app:
    build: .
    image: docker-notes-free-learning:1.0
    env_file:
      - .env
    ports:
      - "3010:3010"
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    extra_hosts:
      - "host.internal.docker:host-gateway"
    
    
